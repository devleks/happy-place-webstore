# NOTE: Copy this file to .github/workflows/agents.yml when ready to run in GitHub Actions.
# Optimized for macOS runners with caching and parallel execution
name: Happy Place Agents (macOS)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # 2 AM daily
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Optimize concurrency - cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  # macOS-specific optimizations
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  lintguard:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for speed

      - name: Setup Python with caching
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Cache LintGuard results
        uses: actions/cache@v4
        with:
          path: |
            frontend/.eslintcache
            frontend/node_modules/.cache
          key: lintguard-${{ runner.os }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.ts', 'frontend/**/*.jsx', 'frontend/**/*.tsx') }}
          restore-keys: |
            lintguard-${{ runner.os }}-

      - name: Run LintGuard
        run: |
          chmod +x ci_workflows/agent_lintguard.sh
          SKIP_AGENT_BOOTSTRAP=0 ci_workflows/agent_lintguard.sh

      - name: Upload LintGuard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lintguard-results
          path: reports/lintguard*
          retention-days: 7

  schemasage:
    needs: lintguard
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python with caching
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --prefer-binary -r backend/requirements.txt

      - name: Run SchemaSage
        run: |
          chmod +x ci_workflows/agent_schemasage.sh
          ci_workflows/agent_schemasage.sh

      - name: Upload SchemaSage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemasage-results
          path: reports/schemasage*
          retention-days: 7

  perfsmith:
    needs: lintguard
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python with caching
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            frontend/dist
            frontend/build
            frontend/.next
          key: perfsmith-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            perfsmith-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            perfsmith-build-${{ runner.os }}-

      - name: Run PerfSmith
        run: |
          chmod +x ci_workflows/agent_perfsmith.sh
          RUN_PERF_BUILD=1 ci_workflows/agent_perfsmith.sh

      - name: Upload PerfSmith results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfsmith-results
          path: reports/perfsmith*
          retention-days: 7

  shieldprobe:
    needs:
      - lintguard
      - perfsmith
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python with caching
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install --prefer-binary -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Cache security scan data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shieldprobe
            .shieldprobe-cache
          key: shieldprobe-${{ runner.os }}-${{ hashFiles('backend/**/*.py', 'frontend/**/*.js', 'frontend/**/*.ts') }}
          restore-keys: |
            shieldprobe-${{ runner.os }}-

      - name: Run ShieldProbe
        run: |
          chmod +x ci_workflows/agent_shieldprobe.sh
          ci_workflows/agent_shieldprobe.sh

      - name: Upload ShieldProbe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shieldprobe-results
          path: reports/shieldprobe*
          retention-days: 7

  atlasreporter:
    needs:
      - schemasage
      - shieldprobe
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/artifacts

      - name: Build digest
        run: |
          chmod +x ci_workflows/agent_atlasreporter.sh
          ci_workflows/agent_atlasreporter.sh

      - name: Upload consolidated reports
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports-${{ github.run_number }}
          path: reports
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'reports/summary.md';
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 Agent Reports\n\n${summary}`
              });
            }

  # Optional: Notification job for failures
  notify-on-failure:
    needs:
      - lintguard
      - schemasage
      - perfsmith
      - shieldprobe
      - atlasreporter
    runs-on: macos-latest
    if: failure()
    steps:
      - name: Notify team
        run: |
          echo "One or more agent jobs failed. Check the workflow run for details."
          # Add your notification logic here (Slack, email, etc.)
