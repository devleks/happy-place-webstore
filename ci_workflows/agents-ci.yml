# NOTE: Copy this file to .github/workflows/agents.yml when ready to run in GitHub Actions.
name: Happy Place Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  lintguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run LintGuard
        run: |
          chmod +x ci_workflows/agent_lintguard.sh
          SKIP_AGENT_BOOTSTRAP=0 ci_workflows/agent_lintguard.sh

  schemasage:
    needs: lintguard
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run SchemaSage
        run: |
          chmod +x ci_workflows/agent_schemasage.sh
          ci_workflows/agent_schemasage.sh

  perfsmith:
    needs: lintguard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run PerfSmith
        run: |
          chmod +x ci_workflows/agent_perfsmith.sh
          RUN_PERF_BUILD=1 ci_workflows/agent_perfsmith.sh

  shieldprobe:
    needs:
      - lintguard
      - perfsmith
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run ShieldProbe
        run: |
          chmod +x ci_workflows/agent_shieldprobe.sh
          ci_workflows/agent_shieldprobe.sh

  atlasreporter:
    needs:
      - schemasage
      - shieldprobe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build digest
        run: |
          chmod +x ci_workflows/agent_atlasreporter.sh
          ci_workflows/agent_atlasreporter.sh
      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: reports
